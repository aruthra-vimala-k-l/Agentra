<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentra Consumer Widget -- demo host page</title>
  <style>
    body { font-family: -apple-system, Segoe UI, sans-serif; background: #f6f8fa; padding: 32px; color: #1f2328; }
    .host-mock { max-width: 480px; margin: 0 auto; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 24px; }
    .host-mock h2 { margin-top: 0; font-size: 16px; color: #57606a; }
    .agentra-widget-card { border: 1px solid #d0d7de; border-radius: 8px; padding: 14px 16px; margin-top: 12px; }
    .agentra-widget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .agentra-widget-badge { color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; }
    .agentra-widget-summary { margin: 4px 0; font-size: 13px; color: #1f2328; }
    .agentra-widget-reason { margin: 4px 0; font-size: 13px; color: #57606a; font-style: italic; }
    .agentra-widget-disclosure { margin: 4px 0; font-size: 12px; color: #9a6700; background: #fff8c5; padding: 6px 8px; border-radius: 4px; }
    .agentra-widget-irreversibility { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 8px; }
    .agentra-widget-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .agentra-widget-footer { margin-top: 10px; font-size: 10px; color: #8c959f; text-align: right; }
    label { display: block; font-size: 13px; margin-top: 12px; }
    input { width: 100%; padding: 6px 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 6px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="host-mock">
    <h2>Merchant checkout page (mock host)</h2>
    <p style="font-size: 13px; color: #57606a;">
      This page stands in for a third-party merchant's own checkout page.
      It embeds the Agentra Consumer Widget with two lines of code -- it
      does not know anything about ASIDE, the shopping agent, or the
      attribution engine underneath it.
    </p>
    <label for="session-id">Session ID (from a completed purchase in the main demo)</label>
    <input id="session-id" placeholder="paste a session_id here" />
    <button id="load-btn">Load decision</button>

    <div id="agentra-widget"></div>
  </div>

  <script src="/static/widget.js"></script>
  <script>
    document.getElementById("load-btn").addEventListener("click", () => {
      const sessionId = document.getElementById("session-id").value.trim();
      if (sessionId) AgentraWidget.renderFromSession("agentra-widget", sessionId);
    });
  </script>
</body>
</html>
