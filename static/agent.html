<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentra autonomous agent</title>
<style>
  body{font-family:-apple-system,Segoe UI,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:24px 32px;max-width:960px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:#8b949e;font-size:13px;margin-bottom:20px}
  .row{display:flex;gap:8px} input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:14px}
  button{padding:10px 16px;border-radius:8px;border:0;background:#e8a838;color:#10192b;font-weight:600;cursor:pointer} button:disabled{opacity:.5}
  .card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px 16px;margin-top:14px;font-size:13px;line-height:1.5}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
  .ok{background:#12351f;color:#56d364}.warn{background:#3b2f0b;color:#e3b341}.bad{background:#3d1418;color:#ff7b72}
  .chk{margin:2px 0}.mut{color:#8b949e} code{background:#0d1117;padding:1px 6px;border-radius:4px}
</style></head><body>
<h1>Agentra autonomous agent</h1>
<div class="sub">Give it a goal. It searches real products, verifies them, asks the governance gate, buys inside hard limits, then checks the order. It stops for a human when the gate flags a purchase. <a href="/dashboard" style="color:#58a6ff">Dashboard</a></div>
<div class="row"><input id="goal" value="anniversary gift, jewellery, budget 3000"><button id="go">Run agent</button></div>
<div id="out"></div>
<script>
const out=document.getElementById('out'),btn=document.getElementById('go');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls={purchased:'ok',purchased_unverified:'warn',awaiting_human_approval:'warn',needs_information:'warn',no_purchase:'bad'};
function checks(c){return (c||[]).map(x=>`<div class="chk">${x.ok?'✔':'✖'} ${esc(x.check)} <span class="mut">${esc(x.detail)}</span></div>`).join('')}
btn.onclick=async()=>{
  btn.disabled=true; out.innerHTML='<div class="card mut">Working…</div>';
  try{
    const r=await fetch('/agent/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:document.getElementById('goal').value})});
    const d=await r.json();
    let h=`<div class="card"><span class="pill ${cls[d.outcome]||'warn'}">${esc(d.outcome)}</span> <span class="mut">payment mode: ${esc(d.payment_mode)}</span><p>${esc(d.message)}</p></div>`;
    for(const a of d.attempts){
      h+=`<div class="card"><b>${esc(a.product_id)}</b> · ${esc(a.outcome)} · gate: ${esc(a.gate_decision||'n/a')}<div class="mut" style="margin:6px 0">Product verification</div>${checks(a.product_check?.checks)}`;
      if(a.order){h+=`<div class="mut" style="margin:6px 0">Order ${esc(a.order.order_id)} · ₹${esc(a.order.amount_inr)} · status ${esc(a.order.status)}</div>${checks(a.order_check?.checks)}`}
      h+=`<p class="mut">${esc(a.reply)}</p></div>`;
    }
    h+=`<div class="card mut">Audit chain intact: <b>${esc(d.audit?.ok ?? d.audit?.valid ?? JSON.stringify(d.audit))}</b></div>`;
    out.innerHTML=h;
  }catch(e){out.innerHTML=`<div class="card"><span class="pill bad">error</span> ${esc(e.message)}</div>`}
  btn.disabled=false;
};
</script></body></html>
